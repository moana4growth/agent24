<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MoodBreak</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#101014; --panel:#1a1a21; --line:#2c2c36; --tx:#e8e8ee; --dim:#8b8b98; --ac:#e4ff4f; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:14px/1.6 "Pretendard","Apple SD Gothic Neo",system-ui,sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:17px; letter-spacing:-.3px; }
  header .tag { color:var(--dim); font-size:12px; }
  header a { color:var(--ac); font-size:12px; margin-left:auto; text-decoration:none; }
  main { display:grid; grid-template-columns: 380px 1fr; gap:0; height:calc(100vh - 49px); }
  #left { border-right:1px solid var(--line); padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:14px; }
  #right { padding:16px; overflow-y:auto; }
  textarea,input[type=text] { width:100%; background:var(--panel); border:1px solid var(--line); border-radius:6px; color:var(--tx); padding:10px; font:inherit; resize:vertical; }
  textarea:focus,input:focus { outline:1px solid var(--ac); }
  label { font-size:12px; color:var(--dim); display:block; margin-bottom:4px; }
  button { background:var(--ac); color:#111; border:0; border-radius:6px; padding:10px 14px; font:600 14px/1 inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--tx); border:1px solid var(--line); }
  button:disabled { opacity:.4; cursor:default; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  #plan ol { padding-left:18px; }
  #plan .rat { color:var(--dim); font-size:12px; margin-top:6px; }
  #log { display:flex; flex-direction:column; gap:8px; }
  .msg { border-left:3px solid var(--ac); padding:6px 10px; background:var(--panel); border-radius:0 6px 6px 0; white-space:pre-wrap; }
  .msg .who { color:var(--ac); font-size:11px; font-weight:700; }
  .phase { color:var(--dim); font-size:12px; }
  #moods { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
  .mood { border:1px solid var(--line); border-radius:8px; padding:12px; cursor:pointer; background:var(--panel); }
  .mood:hover { border-color:var(--ac); }
  .mood.rec { border-color:var(--ac); }
  .mood .pal { display:flex; height:18px; border-radius:4px; overflow:hidden; margin:8px 0; }
  .mood .pal i { flex:1; }
  .mood h3 { font-size:14px; } .mood p { font-size:12px; color:var(--dim); }
  .mood .badge { font-size:10px; color:#111; background:var(--ac); border-radius:3px; padding:1px 5px; margin-left:6px; }
  .mood .mprev { width:100%; height:200px; border:0; border-radius:6px; margin:8px 0; background:#fff; pointer-events:none; }
  #tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  #tabs button { background:var(--panel); color:var(--tx); border:1px solid var(--line); font-weight:400; font-size:12px; }
  #tabs button.on { border-color:var(--ac); color:var(--ac); }
  iframe { width:390px; height:700px; border:1px solid var(--line); border-radius:12px; background:#fff; }
  .frames { display:flex; gap:16px; flex-wrap:wrap; }
  pre.doc { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; overflow:auto; max-height:75vh; white-space:pre-wrap; font-size:12.5px; }
  #askbox .opts { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  #feedbackbar { display:flex; gap:8px; margin-top:10px; }
  .spin { display:inline-block; width:10px; height:10px; border:2px solid var(--ac); border-top-color:transparent; border-radius:50%; animation:r 1s linear infinite; vertical-align:middle; margin-right:6px;}
  @keyframes r { to { transform:rotate(360deg);} }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>MoodBreak</h1>
  <span class="tag">agentic brand-to-design-system consultant</span>
  <a href="/stream" target="_blank">↗ raw stream (second screen)</a>
</header>
<main>
  <div id="left">
    <div>
      <label>서비스 브리프 (한 문장)</label>
      <textarea id="brief" rows="3" placeholder="예: 직장인 점심 메뉴 추천 앱, 타겟 20~30대"></textarea>
    </div>
    <div>
      <label>무드 신호 (선택 — 키워드, 레퍼런스 URL, 리서치 텍스트 통째로 붙여넣기 OK)</label>
      <textarea id="reference" rows="3" placeholder="예: 배민 말고 킨포크 잡지 느낌 / Refero 등에서 뽑은 스타일 리서치 전문을 붙여넣어도 됩니다"></textarea>
    </div>
    <div>
      <label>레퍼런스 이미지 (선택)</label>
      <input type="file" id="img" accept="image/*">
    </div>
    <button id="start">에이전트 실행</button>

    <div class="box hidden" id="plan"><b>실행 계획</b> <span class="phase">(에이전트가 이 입력에 맞춰 수립)</span><ol id="plansteps"></ol><div class="rat" id="planrat"></div></div>
    <div class="box hidden" id="askbox"><b id="askq"></b><div class="opts" id="askopts"></div></div>
    <div id="log"></div>
  </div>

  <div id="right">
    <div id="moodwrap" class="hidden">
      <h2 style="font-size:15px;margin-bottom:8px">무드 방향 — 에이전트 제안 <span class="phase">(하나를 선택하세요)</span></h2>
      <div id="moods"></div>
    </div>
    <div id="results" class="hidden">
      <div id="tabs"></div>
      <div id="tabbody"></div>
      <div id="feedbackbar">
        <input type="text" id="fb" placeholder='피드백 — 예: "CTA만 더 진하게", "고령층도 쓰기 쉽게"'>
        <button id="fbsend" class="ghost">보내기</button>
      </div>
    </div>
  </div>
</main>
<script>
const ws = new WebSocket(`ws://${location.host}/ws/app`);
const $ = id => document.getElementById(id);
const artifacts = {};   // filename -> {kind, content}
let running = false;

function send(o){ ws.send(JSON.stringify(o)); }
function log(who, text){
  const d = document.createElement('div'); d.className='msg';
  d.innerHTML = `<div class="who">${who||'agent'}</div>`;
  d.append(text); $('log').append(d); d.scrollIntoView({behavior:'smooth'});
}
function phase(t){ const d=document.createElement('div'); d.className='phase';
  d.innerHTML = `<span class="spin"></span>${t}`; $('log').append(d); d.scrollIntoView(); }

$('start').onclick = async () => {
  if (running) return;
  const brief = $('brief').value.trim(); if(!brief) return alert('브리프를 입력하세요');
  let image_b64 = null;
  const f = $('img').files[0];
  if (f) image_b64 = await new Promise(r=>{const rd=new FileReader();
    rd.onload=()=>r(rd.result.split(',')[1]); rd.readAsDataURL(f);});
  running = true; $('start').disabled = true;
  $('log').innerHTML=''; $('plansteps').innerHTML='';
  send({type:'start', brief, reference:$('reference').value.trim()||null, image_b64});
  phase('오케스트레이터 기동 — 계획 수립 중');
};

$('fbsend').onclick = () => {
  const t = $('fb').value.trim(); if(!t || running) return;
  running = true; $('fb').value='';
  log('you', t); phase('피드백 턴 — 영향 분석 중');
  send({type:'feedback', text:t});
};

ws.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.type==='plan'){
    $('plan').classList.remove('hidden');
    $('plansteps').innerHTML = m.steps.map(s=>`<li>${esc(s)}</li>`).join('');
    $('planrat').textContent = m.rationale;
  }
  else if (m.type==='agent_text'){ log(m.agent, m.text); }
  else if (m.type==='phase' && m.tool){ phase(`tool: ${m.tool}`); }
  else if (m.type==='ref_images'){
    const d=document.createElement('div'); d.className='msg';
    d.innerHTML=`<div class="who">agent의 눈 — "${esc(m.query)}"</div>`;
    const row=document.createElement('div'); row.style.cssText='display:flex;gap:6px;margin-top:6px;flex-wrap:wrap';
    m.images.forEach(src=>{const im=document.createElement('img'); im.src=src;
      im.style.cssText='height:80px;border-radius:4px;border:1px solid var(--line)'; row.append(im);});
    d.append(row); $('log').append(d); d.scrollIntoView();
  }
  else if (m.type==='mood_cards'){ renderMoods(m); }
  else if (m.type==='ask'){ renderAsk(m); }
  else if (m.type==='artifact'){ addArtifact(m); }
  else if (m.type==='done'){ running=false; $('start').disabled=false; log('orchestrator ✓', m.final||'완료');
    $('results').classList.remove('hidden'); /* always allow follow-up input */ }
  else if (m.type==='error'){ running=false; $('start').disabled=false; log('⚠ error', m.message); }
};

let moodChosen = false;
function renderMoods(m){
  moodChosen = false;
  $('moodwrap').classList.remove('hidden'); const box=$('moods'); box.innerHTML='';
  m.cards.forEach(c=>{
    const d=document.createElement('div'); d.className='mood'+(c.id===m.recommended?' rec':'');
    d.innerHTML = `<h3>${esc(c.name)}${c.id===m.recommended?'<span class="badge">추천</span>':''}</h3>
      ${c.preview_html?`<iframe class="mprev" sandbox="allow-same-origin" scrolling="no"></iframe>`:
        `<div class="pal">${(c.palette||[]).map(p=>`<i style="background:${esc(p)}"></i>`).join('')}</div>`}
      <p>${esc((c.keywords||[]).join(' · '))}</p>
      ${c.typography?`<p>🄰 ${esc(c.typography)}</p>`:''}
      ${c.layout_hint?`<p>▦ ${esc(c.layout_hint)}</p>`:''}
      ${(c.anchors&&c.anchors.length)?`<p>⌘ ${esc(c.anchors.join(' / '))}</p>`:''}
      <p>${esc(c.vibe_sentence||'')}</p>
      <p style="margin-top:6px;color:var(--tx)">${esc(c.rationale||'')}</p>`;
    d.onclick=()=>{ if(moodChosen) return; moodChosen = true;
      send({type:'user_response', payload:{selected:c.id, name:c.name}});
      box.querySelectorAll('.mood').forEach(x=>x.style.opacity=.35); d.style.opacity=1;
      phase(`무드 선택: ${c.name} — 전문가 팀 병렬 가동`); };
    box.append(d);
    const pf = d.querySelector('.mprev');
    if (pf) pf.srcdoc = c.preview_html;
  });
}
function renderAsk(m){
  const b=$('askbox'); b.classList.remove('hidden'); $('askq').textContent=m.question;
  const o=$('askopts'); o.innerHTML='';
  m.options.forEach(op=>{ const btn=document.createElement('button'); btn.className='ghost';
    btn.textContent=op; btn.onclick=()=>{ send({type:'user_response',payload:{answer:op}});
      b.classList.add('hidden'); }; o.append(btn); });
  const inp=document.createElement('input'); inp.type='text'; inp.placeholder='직접 입력…';
  inp.onkeydown=ev=>{ if(ev.key==='Enter'&&inp.value.trim()){
    send({type:'user_response',payload:{answer:inp.value.trim()}}); b.classList.add('hidden');}};
  o.append(inp);
}
function addArtifact(m){
  artifacts[m.filename]={kind:m.kind, content:m.content};
  $('results').classList.remove('hidden'); renderTabs(m.filename);
}
let curTab=null;
function renderTabs(activate){
  const tabs=$('tabs'); tabs.innerHTML='';
  Object.keys(artifacts).forEach(fn=>{
    const b=document.createElement('button'); b.textContent=fn;
    b.className=(fn===(activate||curTab))?'on':'';
    b.onclick=()=>{ curTab=fn; renderTabs(); showTab(fn); };
    tabs.append(b);
  });
  if(activate){ curTab=activate; showTab(activate); }
}
function showTab(fn){
  const a=artifacts[fn]; const body=$('tabbody'); body.innerHTML='';
  if(fn.endsWith('.html')){
    const wrap=document.createElement('div'); wrap.className='frames';
    const ifr=document.createElement('iframe'); ifr.srcdoc=a.content;
    if(a.kind==='brandbook'){ ifr.style.width='100%'; ifr.style.height='82vh'; ifr.style.borderRadius='4px'; }
    wrap.append(ifr); body.append(wrap);
  } else {
    const pre=document.createElement('pre'); pre.className='doc'; pre.textContent=a.content; body.append(pre);
  }
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
</script>
</body>
</html>
